<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f0d" />
    <meta name="description" content="Apex Predator Elite training planner for speed, agility, plyometrics, and ball mastery." />
    <title>Apex Predator Elite</title>
    <script>
      const targets = ["./apex-predator-elite.html", "./public/apex-predator-elite.html"];

      async function openApp() {
        for (const target of targets) {
          try {
            const response = await fetch(target, { method: "HEAD", cache: "no-store" });
            if (response.ok) {
              window.location.replace(target);
              return;
            }
          } catch (error) {
            // Try the next static target.
          }
        }

        document.body.textContent = "Apex Predator Elite could not load.";
      }

      openApp();
    </script>
  </head>
  <body>
    <noscript>
      <a href="./apex-predator-elite.html">Open Apex Predator Elite</a>
    </noscript>
  </body>
</html>
